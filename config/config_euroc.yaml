general:
    test: True
    verbose: True
    n_cameras: 2 # Both monocular and multiview are supported

local_features:
    features_name: superpoint
    superpoint:
        resize_width: 752
        resize_height: 480
        do_resize: True
    aliked:
        model_name: "aliked-n16rot" # choices=['aliked-t16', 'aliked-n16', 'aliked-n16rot', 'aliked-n32'], default="aliked-n16rot"
        top_k: 500
        scores_th: 0.2
        n_limit: 5000

mapping:
    sliding_window: 10
    max_match_distance: 0.2
    max_keyframes: 10000000
    method: "custom" # choices=['with_pycolmap_reconstruct', 'custom']