general:
    test: False
    verbose: False
    n_cameras: 2 # Both monocular and multiview are supported

local_features:
    features_name: superpoint # choices=['superpoint', 'aliked']
    superpoint:
        resize_width: 640 # tested with 640
        resize_height: 480 # tested with 480
        do_resize: True
    aliked:
        model_name: "aliked-n32" # choices=['aliked-t16', 'aliked-n16', 'aliked-n16rot', 'aliked-n32'], default="aliked-n16rot"
        top_k: 1000
        scores_th: 0.2
        n_limit: 5000

mapping:
    start_frame: 230
    baseline: 1.50 # 1.5 CARLA  0.110078 EUROC
    sliding_window: 10 # tested with 10
    max_match_distance: 5
    max_keyframes: 1000000
    method: "custom" # choices=['with_pycolmap_reconstruct', 'custom']