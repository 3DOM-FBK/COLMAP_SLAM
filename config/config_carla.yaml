general:
    test: False
    log: True
    frames_range: [0, -1] # -1 means all frames

local_features:
    features_name: superpoint # choices=['superpoint', 'aliked']
    resize_width: 1920 # tested with 640
    resize_height: 1080 # tested with 480
    superpoint:
        do_resize: True
        top_k: 1000
    aliked:
        model_name: "aliked-n32" # choices=['aliked-t16', 'aliked-n16', 'aliked-n16rot', 'aliked-n32'], default="aliked-n16rot"
        top_k: 1000
        scores_th: 0.2
        n_limit: 1000

mapping:
    cameras: ["cam0", "cam1"] # Both monocular and multiview are supported
    rig_match_rule:
        - ["cam0", "cam1"]
    cameras_for_baseline_estim: ["cam0", "cam1"]
    baseline: 1.40
    sliding_window: 10
    max_match_distance: 5
    max_keyframes: 1000000
    method: "custom" # choices=['with_pycolmap_reconstruct', 'custom']