[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colmap-visual-odometry"
version = "0.0.1"
description = "Visual odometry package"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    { name = "Luca Morelli", email = "lcmorelli.eng@gmail.com" }
]
dependencies = [
    pycolmap==3.13
]

[project.urls]
Homepage = "https://github.com/lcmrl/clsam"
